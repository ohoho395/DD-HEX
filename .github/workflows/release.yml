name: DD HEX Windows 构建与发布

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ddhex-windows-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'release' }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  release-windows:
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    permissions:
      contents: write
    uses: ./.github/workflows/windows-package.yml
    with:
      official: true

  test-windows:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/windows-package.yml
    with:
      official: false
